  :root {
    --mocha-1: #8d7064;
    --mocha-2: #6b5046;
    --paper: #f7f0e3;
    --ink: #3b2f28;
    --muted: #8a7a69;
    --cream: #f4e9d6;
    --soft: #e6d6ba;
    --gold: #dfc58f;
    --accent: #a8772f;
    --accent-2: #c18d3d;
    --on-accent: #3d2a10;
    --accent-text: #8a5a24;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --hand: "Estonia", "Snell Roundhand", "Segoe Script", "Brush Script MT", cursive;
  }
  html[data-accent="burgundy"] { --accent: #8c2f39; --accent-2: #a63c48; --on-accent: #fff1ec; --accent-text: #8c2f39; }
  html[data-accent="forest"]   { --accent: #2f6b4a; --accent-2: #3b8260; --on-accent: #f4fbf6; --accent-text: #2f6b4a; }
  html[data-accent="navy"]     { --accent: #28466e; --accent-2: #345a8a; --on-accent: #f3f7fc; --accent-text: #28466e; }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--mocha-2); overflow-x: hidden; overflow-x: clip; }
  body {
    margin: 0;
    min-height: 100vh; min-height: 100dvh;
    background: radial-gradient(130% 100% at 50% 0%, var(--mocha-1) 0%, var(--mocha-2) 100%) fixed;
    color: var(--ink);
    font-family: var(--serif);
    display: flex; align-items: center; justify-content: center;
    padding: 44px 16px 56px;
    overflow-x: hidden;
    overflow-x: clip;
  }
  body::before {                                  /* fine grain over the backdrop */
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'260'%20height%3D'260'%3E%3Cfilter%20id%3D'n'%20x%3D'0'%20y%3D'0'%20width%3D'100%25'%20height%3D'100%25'%3E%3CfeTurbulence%20type%3D'fractalNoise'%20baseFrequency%3D'.85'%20numOctaves%3D'3'%20seed%3D'5'%20stitchTiles%3D'stitch'%2F%3E%3CfeColorMatrix%20values%3D'0%200%200%200%200.2%200%200%200%200%200.13%200%200%200%200%200.09%201.3%200%200%200%20-.5'%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D'260'%20height%3D'260'%20filter%3D'url(%23n)'%2F%3E%3C%2Fsvg%3E");
    opacity: .55;
  }
  main { width: 100%; max-width: 640px; position: relative; z-index: 1; }
  [hidden] { display: none !important; }

  /* ---------- sparkles ---------- */
  .sparks { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .spark { position: absolute; color: var(--gold); opacity: .75; animation: twinkle 5s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: .25; transform: scale(.85); } to { opacity: .9; transform: scale(1.05); } }

  /* ---------- locked screen ---------- */
  .lock { text-align: center; animation: rise .8s ease both; }
  .lock.leaving { animation: fadeout .5s ease forwards; }
  h1 { font-weight: 400; font-size: clamp(1.9rem, 6vw, 2.5rem); letter-spacing: .01em; margin: 0 0 6px; color: #f8eedb; text-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .from { font-family: var(--hand); font-size: clamp(1.9rem, 6.5vw, 2.4rem); color: var(--gold); margin: 0 0 14px; line-height: 1.15; }
  .from:empty { display: none; }
  .sub { color: var(--soft); font-style: italic; margin: 0 auto 28px; max-width: 30em; line-height: 1.55; }
  .sub:empty { display: none; }

  .env {
    position: relative; width: min(300px, 76vw); aspect-ratio: 3 / 2; margin: 0 auto 30px; perspective: 900px;
    filter: drop-shadow(0 18px 20px rgba(40, 24, 14, .4));
  }
  .env-back { position: absolute; inset: 0; background: #ecdcc0; border-radius: 6px; }
  .env-pocket { position: absolute; inset: 0; border-radius: 6px; background: #f3e7cf; clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%); }
  .env-flap {
    position: absolute; left: 0; right: 0; top: 0; height: 58%; background: #e3d0aa;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center; transition: transform .9s cubic-bezier(.5, .05, .2, 1); border-radius: 6px 6px 0 0;
  }
  .addr {
    position: absolute; left: 6%; right: 6%; bottom: 3%; text-align: center;
    font-family: var(--hand); font-feature-settings: "init" 0, "fina" 0;
    font-size: clamp(1.9rem, 8vw, 2.4rem); line-height: 1.1; color: var(--ink); opacity: .88;
    transform: rotate(-2deg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .addr:empty { display: none; }

  .seal {
    width: 52px; height: 52px; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, color-mix(in srgb, var(--accent-2) 80%, #fff), var(--accent-2) 30%, var(--accent) 72%);
    box-shadow: 0 3px 7px rgba(0, 0, 0, .35), inset 0 0 0 4px rgba(255, 255, 255, .08), inset 0 -3px 5px rgba(0, 0, 0, .18);
    display: grid; place-items: center; color: var(--on-accent);
    font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 20px;
    text-shadow: 0 1px 0 rgba(255, 255, 255, .25);
  }
  .seal::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .3); pointer-events: none; }
  .env .seal { position: absolute; left: 50%; top: 58%; margin: -26px 0 0 -26px; transition: transform .5s ease, opacity .5s ease; }
  .opened .env-flap { transform: rotateX(180deg); }
  .opened .seal { transform: scale(1.5); opacity: 0; }

  form { max-width: 360px; margin: 0 auto; text-align: left; }
  label { display: block; font-family: var(--sans); font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); margin: 0 0 8px 2px; }
  .field { display: flex; gap: 8px; }
  input[type=password], input[type=text] {
    flex: 1; min-width: 0; font: inherit; font-size: 1.05rem; padding: 13px 14px;
    background: var(--paper); color: var(--ink); border: 1px solid rgba(255, 255, 255, .3); border-radius: 10px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(223, 197, 143, .35); }
  .peek { font-family: var(--sans); font-size: .85rem; padding: 0 14px; border-radius: 10px; background: rgba(255, 255, 255, .06); color: var(--soft); border: 1px solid rgba(255, 255, 255, .28); cursor: pointer; }
  .peek:hover { color: #fff; }
  .open-btn {
    width: 100%; margin-top: 14px; font-family: var(--sans); font-size: 1rem; font-weight: 600; letter-spacing: .02em;
    padding: 14px 18px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--paper); color: var(--ink); box-shadow: 0 6px 14px rgba(40, 24, 14, .28);
    transition: transform .12s, background .15s, opacity .15s;
  }
  .open-btn:hover { background: #fffaf0; }
  .open-btn:active { transform: translateY(1px); }
  .open-btn[disabled] { opacity: .7; cursor: progress; }
  .msg { min-height: 1.5em; margin: 12px 2px 0; font-family: var(--sans); font-size: .9rem; color: #ffd9c4; }
  .shake { animation: shake .4s; }

  /* ---------- the letter on torn paper ---------- */
  .letter { animation: rise .9s ease both; }
  .paper-wrap {
    position: relative;
    filter: drop-shadow(0 20px 22px rgba(35, 20, 12, .38)) drop-shadow(0 2px 3px rgba(35, 20, 12, .25));
    margin-top: 40px;
  }
  .sheet-edge { position: absolute; inset: -5px; background: #efe5d1; filter: url(#torn-a); }
  .sheet {
    position: absolute; inset: 0;
    background-color: var(--paper);
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'260'%20height%3D'260'%3E%3Cfilter%20id%3D'n'%20x%3D'0'%20y%3D'0'%20width%3D'100%25'%20height%3D'100%25'%3E%3CfeTurbulence%20type%3D'fractalNoise'%20baseFrequency%3D'.85'%20numOctaves%3D'3'%20seed%3D'5'%20stitchTiles%3D'stitch'%2F%3E%3CfeColorMatrix%20values%3D'0%200%200%200%200.55%200%200%200%200%200.43%200%200%200%200%200.3%201.2%200%200%200%20-.5'%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D'260'%20height%3D'260'%20filter%3D'url(%23n)'%2F%3E%3C%2Fsvg%3E"), radial-gradient(120% 80% at 30% 0%, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 60%);
    filter: url(#torn-b);
  }
  .paper-body {
    position: relative;
    padding: clamp(84px, 14vw, 104px) clamp(26px, 8vw, 66px) clamp(54px, 9vw, 70px);
  }
  .paper-body p {
    margin: 0 0 1.2em; font-size: clamp(1.03rem, 2.6vw, 1.15rem); line-height: 1.8; color: var(--ink);
    white-space: pre-line; opacity: 0; transform: translateY(8px); animation: line .7s ease forwards;
  }
  .paper-body p:last-child { margin-bottom: 0; }
  .paper-body p.greet { font-family: var(--hand); font-size: clamp(2.1rem, 7vw, 2.7rem); line-height: 1.15; margin-bottom: .55em; }
  .sig {
    display: inline-block; margin-top: .1em; font-family: var(--hand); font-feature-settings: "init" 0, "fina" 0;
    font-size: clamp(2.5rem, 9vw, 3.3rem); line-height: 1.2; color: var(--accent-text); transform: rotate(-3deg); transform-origin: left center;
  }
  .from, .paper-body p.greet { font-feature-settings: "init" 0, "fina" 0; }
  /* centred lines (short quotes, or lines that start with >) */
  .paper-body p.center { text-align: center; }
  /* handwritten body (the default); the "print" style keeps the plain serif */
  .paper-body.hand p { font-family: var(--hand); font-feature-settings: "init" 0, "fina" 0; font-size: clamp(1.5rem, 4.6vw, 1.78rem); line-height: 1.5; letter-spacing: .012em; }
  .paper-body.hand p.greet { font-size: clamp(2.1rem, 7vw, 2.7rem); line-height: 1.15; letter-spacing: 0; }
  .paper-body.hand p.center { font-size: clamp(1.55rem, 4.8vw, 1.85rem); }

  .pin {
    position: absolute; left: 50%; top: 4px; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f3e0ae, #bd9043 52%, #7b5822);
    box-shadow: 0 5px 6px rgba(30, 18, 8, .45), inset 0 -2px 3px rgba(0, 0, 0, .3);
  }
  .flower { position: absolute; right: -30px; top: -66px; width: clamp(104px, 28vw, 150px); height: auto; transform: rotate(13deg); transform-origin: 46% 98%; filter: drop-shadow(0 3px 3px rgba(35, 20, 12, .25)); }
  .tape-wrap { position: absolute; right: clamp(6px, 2.4vw, 22px); top: clamp(58px, 13vw, 88px); transform: rotate(-26deg); filter: drop-shadow(0 2px 2px rgba(30, 18, 8, .28)); }
  .tape-wrap::before {
    content: ""; display: block; width: 84px; height: 27px;
    background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .16) 0 2px, rgba(255, 255, 255, 0) 2px 6px), rgba(236, 222, 190, .8);
    clip-path: polygon(0 0, 100% 0, 97% 14%, 100% 28%, 97% 42%, 100% 57%, 97% 71%, 100% 85%, 97% 100%, 0 100%, 3% 85%, 0 71%, 3% 57%, 0 42%, 3% 28%, 0 14%);
  }
  .seal.mini { position: absolute; right: clamp(20px, 6vw, 46px); bottom: -22px; width: 58px; height: 58px; font-size: 22px; transform: rotate(-9deg); }

  .actions { text-align: center; margin-top: 44px; }
  .ghost { font-family: var(--sans); font-size: .85rem; color: var(--soft); background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .28); border-radius: 999px; padding: 9px 18px; cursor: pointer; }
  .ghost:hover { color: #fff; border-color: rgba(255, 255, 255, .55); }
  .ghost[disabled] { opacity: .7; cursor: progress; }
  .actions .ghost { margin: 0 4px; }
  .pdfmsg { min-height: 1.4em; margin: 12px 0 0; font-family: var(--sans); font-size: .85rem; color: var(--soft); }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fadeout { to { opacity: 0; transform: translateY(-8px); } }
  @keyframes line { to { opacity: 1; transform: none; } }
  @keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
  }
  @media print {
    body { background: #fff; display: block; padding: 0; }
    body::before, .sparks, .lock, .actions, .sheet, .sheet-edge, .pin, .flower, .tape-wrap, .seal.mini { display: none !important; }
    .paper-wrap { filter: none; margin: 0; }
    .paper-body { padding: 0; }
    .paper-body p { opacity: 1; transform: none; animation: none; color: #000; }
    .sig { color: #000; }
  }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="torn-a" x="-6%" y="-6%" width="112%" height="112%">

    <filter id="torn-b" x="-6%" y="-6%" width="112%" height="112%">

  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(p.i) }, key, b64(p.c));
  return td.decode(plain);
}

/* ---- turning the plain text into a page ---- */
const GREET_RE = /^(dear|hi|hello|hey)\b[^.!?]{0,44}$/i;
const isCenterLine = l => {
  const t = l.trim();
  if (t.startsWith(">")) return true;
  return t.length <= 90 && /^[“"„].+[”"]\W{0,3}$/.test(t);        // a short line wrapped in quotes
};
const cleanLine = l => l.trim().replace(/^>\s?/, "");

function planLetter(text) {
  const from = (PAYLOAD.from || "").trim(), to = (PAYLOAD.to || "").trim();
  const greetDefault = PAYLOAD.greet != null ? String(PAYLOAD.greet).trim() : (to ? "Dear " + to + "," : "");
  const closeDefault = PAYLOAD.close != null ? String(PAYLOAD.close).trim() : "Warm regards,";
  let lines = text.replace(/\r/g, "").trim().split("\n").map(l => l.replace(/\s+$/, ""));

  // greeting: use the one already in the letter, otherwise add the one from the lock tool
  let greet = "";
  const first = (lines[0] || "").trim();
  if (first.length <= 50 && GREET_RE.test(first)) { greet = first; lines.shift(); }
  else greet = greetDefault;
  while (lines.length && !lines[0].trim()) lines.shift();

  // closing + signature
  let close = "", sig = "";
  const ne = lines.map((l, i) => [l.trim(), i]).filter(x => x[0]);
  const last = ne.length ? ne[ne.length - 1] : null, prev = ne.length > 1 ? ne[ne.length - 2] : null;
  const shortNoStop = t => t.length <= 40 && !/[.!?]$/.test(t);
  if (last && prev && /,$/.test(prev[0]) && prev[0].length <= 40 && shortNoStop(last[0])) {
    close = prev[0]; sig = last[0]; lines = lines.slice(0, prev[1]);
  } else if (last && /,$/.test(last[0]) && last[0].length <= 40) {
    close = last[0]; sig = from; lines = lines.slice(0, last[1]);
  } else if (last && from && last[0].toLowerCase() === from.toLowerCase()) {
    close = closeDefault; sig = last[0]; lines = lines.slice(0, last[1]);
  } else {
    close = closeDefault; sig = from;
  }
  if (!sig) close = close;           // closing words without a name are still fine
  while (lines.length && !lines[lines.length - 1].trim()) lines.pop();

  // body: paragraphs, with centred runs for quoted / ">" lines
  const items = [];
  if (greet) items.push({ kind: "greet", text: greet });
  text = lines.join("\n");
  (text ? text.split(/\n{2,}|\n[ \t]*\n/) : []).forEach(block => {
    let run = [], mode = null;
    const flush = () => { if (run.length) items.push({ kind: mode ? "center" : "p", text: run.join("\n") }); run = []; };
    block.split("\n").forEach(l => {
      if (!l.trim()) return;
      const c = isCenterLine(l);
      if (c !== mode) { flush(); mode = c; }
      run.push(c ? cleanLine(l) : l.trim());
    });
    flush();
  });
  if (close || sig) items.push({ kind: "sign", text: close, sig });
  return items;
}

function showLetter(text) {
  const paper = $("paper");
  paper.textContent = "";
  paper.classList.toggle("hand", PAYLOAD.style !== "print");
  planLetter(text).forEach((it, i) => {
    const p = document.createElement("p");
    if (it.kind === "greet") { p.className = "greet"; p.textContent = it.text; }
    else if (it.kind === "center") { p.className = "center"; p.textContent = it.text; }
    else if (it.kind === "sign") {
      p.className = "signoff";
      p.textContent = it.text ? it.text + (it.sig ? "\n" : "") : "";
      if (it.sig) { const sg = document.createElement("span"); sg.className = "sig"; sg.textContent = it.sig; p.appendChild(sg); }
    } else p.textContent = it.text;
    p.style.animationDelay = (0.25 + i * 0.3) + "s";
    paper.appendChild(p);
  });
  $("lock").hidden = true;
  $("letter").hidden = false;
  window.scrollTo(0, 0);
}

/* ---- download the page as a high-resolution PDF (a picture of the page inside a PDF) ---- */
const PDF_W = 760;                                                   // layout width in CSS px
const pdfMsg = t => { $("pdfmsg").textContent = t || ""; };

async function renderStage() {
  const css = document.querySelector("style").textContent
    .replace(/:root\s*\{/g, ".pdf-root{").replace(/html\[data-accent/g, ".pdf-root[data-accent");
  const override = `
    html,body{background:none!important;display:block!important;padding:0!important;margin:0!important;min-height:0!important;overflow:visible!important}
    body::before{display:none!important}
    .pdf-root{position:relative;width:${PDF_W}px;overflow:hidden;color:var(--ink);font-family:var(--serif);
      background:radial-gradient(130% 100% at 50% 0%,var(--mocha-1) 0%,var(--mocha-2) 100%)}
    .pdf-grain{position:absolute;inset:0;opacity:.55;background-image:var(--grain)}
    .pdf-main{position:relative;width:100%;padding:40px 60px 84px}
    .pdf-root .spark{position:absolute;animation:none!important;opacity:.75;transform:none}
    .pdf-root *{animation:none!important}
    .pdf-root .letter{animation:none!important;opacity:1!important;transform:none!important}
    .pdf-root .paper-body p{opacity:1!important;transform:none!important}
    .pdf-root .paper-wrap{margin-top:40px}`;
  const grain = getComputedStyle(document.body, "::before").backgroundImage;
  const sparks = [[7,3,20],[86,5,13],[14,9,9],[93,31,22],[5,48,12],[90,63,10],[8,78,24],[84,90,14],[16,95,9],[60,2,10]]
    .map(([x, y, s]) => `<svg class="spark" style="left:${x}%;top:${y}%;width:${s}px;height:${s}px"><use href="#star"/></svg>`).join("");
  const defs = document.querySelector("svg[aria-hidden] defs").innerHTML;
  const clone = document.querySelector(".paper-wrap").cloneNode(true);
  clone.querySelectorAll("[id]").forEach(n => n.removeAttribute("id"));
  const accent = document.documentElement.dataset.accent || "";
  const body = `<div class="pdf-root" ${accent ? `data-accent="${accent}"` : ""} style="--grain:${grain.replace(/"/g, "'")}">
      <div class="pdf-grain"></div><div class="pdf-main"><svg width="0" height="0" style="position:absolute"><defs>${defs}</defs></svg>${clone.outerHTML}</div>${sparks}</div>`;

  const frame = document.createElement("iframe");
  frame.setAttribute("aria-hidden", "true");
  frame.style.cssText = `position:fixed;left:-99999px;top:0;width:${PDF_W}px;height:600px;border:0;visibility:hidden`;
  document.body.appendChild(frame);
  try {
    frame.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><style>${css}${override}</style></head><body>${body}</body></html>`;
    await new Promise((res, rej) => { frame.onload = res; setTimeout(() => rej(new Error("frame timeout")), 8000); });
    const d = frame.contentDocument;
    try { await d.fonts.load('28px "Estonia"'); await d.fonts.ready; } catch (_) {}
    await new Promise(r => setTimeout(r, 120));
    const root = d.querySelector(".pdf-root");
    const H = Math.ceil(root.getBoundingClientRect().height);
    root.style.height = H + "px";
    const xml = new XMLSerializer().serializeToString(root);
    return { H, css: css + override, xml, defs };
  } finally { frame.remove(); }
}

function loadSvgImage(svg) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error("render failed"));
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
}

function makePdf(jpeg, pw, ph, title) {
  const W = 595.28, H = Math.min(14400, W * ph / pw);
  const enc = new TextEncoder(), parts = [], offs = [];
  let len = 0;
  const push = x => { const u = typeof x === "string" ? enc.encode(x) : x; parts.push(u); len += u.length; };
  const obj = (n, body) => { offs[n] = len; push(n + " 0 obj\n"); push(body); push("\nendobj\n"); };
  push("%PDF-1.4\n%âãÏÓ\n");
  obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
  obj(2, "<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W.toFixed(2)} ${H.toFixed(2)}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  offs[4] = len; push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pw} /Height ${ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);
  push(jpeg); push("\nendstream\nendobj\n");
  const content = `q ${W.toFixed(2)} 0 0 ${H.toFixed(2)} 0 0 cm /Im0 Do Q`;
  obj(5, `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  const safe = String(title).replace(/[^\x20-\x7e]/g, "").replace(/[()\\]/g, "");
  obj(6, `<< /Title (${safe}) /Producer (Sealed letter) >>`);
  const xref = len;
  let x = "xref\n0 7\n0000000000 65535 f \n";
  for (let n = 1; n <= 6; n++) x += String(offs[n]).padStart(10, "0") + " 00000 n \n";
  push(x + `trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  const out = new Uint8Array(len); let o = 0;
  parts.forEach(u => { out.set(u, o); o += u.length; });
  return out;
}

async function downloadPdf() {
  const btn = $("pdf");
  btn.disabled = true; pdfMsg("Preparing your PDF…");
  try {
    const { H, css, xml, defs } = await renderStage();
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${PDF_W}" height="${H}" viewBox="0 0 ${PDF_W} ${H}">
      <defs>${defs}</defs>
      <foreignObject x="0" y="0" width="${PDF_W}" height="${H}"><div xmlns="http://www.w3.org/1999/xhtml"><style><![CDATA[${css}]]></style>${xml}</div></foreignObject></svg>`;
    let scale = 2400 / PDF_W;                                     // ~2400 px wide: sharp when zoomed or printed
    while (PDF_W * scale * H * scale > 15e6 && scale > 1.2) scale -= 0.1;
    const cw = Math.round(PDF_W * scale), ch = Math.round(H * scale);
    const cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
    const ctx = cv.getContext("2d");
    for (let pass = 0; pass < 2; pass++) {                        // the first pass can draw before the font is ready
      const img = await loadSvgImage(svg);
      ctx.clearRect(0, 0, cw, ch);
      ctx.drawImage(img, 0, 0, cw, ch);
      if (pass === 0) await new Promise(r => setTimeout(r, 250));
    }
    const blob = await new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error("canvas blocked")), "image/jpeg", 0.93));
    const pdf = makePdf(new Uint8Array(await blob.arrayBuffer()), cw, ch, document.title);
    const a = document.createElement("a");
    const nm = (document.title || "letter").replace(/[^\w\- ]+/g, "").trim() || "letter";
    a.href = URL.createObjectURL(new Blob([pdf], { type: "application/pdf" }));
    a.download = nm + ".pdf";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    pdfMsg("Your PDF was saved.");
  } catch (err) {
    pdfMsg("This browser could not make the PDF picture. Opening Print instead: choose “Save as PDF”.");
    setTimeout(() => window.print(), 600);
  } finally { btn.disabled = false; }
}

(function init() {
  if (!PAYLOAD) { $("msg").textContent = "This page has no letter inside yet."; $("go").disabled = true; return; }
  $("clue").textContent = PAYLOAD.clue || "";
  const to = (PAYLOAD.to || "").trim(), from = (PAYLOAD.from || "").trim();
  if (to) { $("title").textContent = "A letter for " + to; $("addr").textContent = "For " + to; document.title = "A letter for " + to; }
  if (from) $("from").textContent = "from " + from;
  if (PAYLOAD.seal) { const s = String(PAYLOAD.seal).slice(0, 2); $("seal").textContent = s; $("seal2").textContent = s; }
  if (["burgundy", "forest", "navy"].includes(PAYLOAD.accent)) document.documentElement.dataset.accent = PAYLOAD.accent;
  if (!window.crypto || !crypto.subtle) {
    $("msg").textContent = "Your browser can't unlock this here. Please open the page in Chrome, Safari or Firefox.";
    $("go").disabled = true;
  }
  $("peek").addEventListener("click", () => {
    const shown = $("key").type === "text";
    $("key").type = shown ? "password" : "text";
    $("peek").textContent = shown ? "Show" : "Hide";
    $("peek").setAttribute("aria-pressed", String(!shown));
  });
  $("print").addEventListener("click", () => window.print());
  $("pdf").addEventListener("click", downloadPdf);
  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const pass = $("key").value;
    if (!norm(pass)) { $("msg").textContent = "Type the passphrase first."; return; }
    $("go").disabled = true; $("go").textContent = "Opening…"; $("msg").textContent = "";
    try {
      const text = await decryptLetter(pass, PAYLOAD);
      $("env").classList.add("opened");
      setTimeout(() => $("lock").classList.add("leaving"), 800);
      setTimeout(() => showLetter(text), 1250);
    } catch (err) {
      $("msg").textContent = "That passphrase doesn't open it. Check it with the person who gave you this.";
      const f = $("form"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
      $("go").disabled = false; $("go").textContent = "Open the letter";
      $("key").focus(); $("key").select();
    }
  });
})();
</script>
